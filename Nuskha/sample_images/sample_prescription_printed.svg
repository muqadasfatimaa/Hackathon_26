<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <!-- Header Border & Rx Logo -->
  <rect x="20" y="20" width="760" height="560" fill="#ffffff" stroke="#2563eb" stroke-width="3" rx="10"/>
  <rect x="30" y="30" width="740" height="70" fill="#f0f7ff" rx="6"/>
  
  <text x="50" y="72" font-size="28" font-weight="bold" fill="#1e3a8a">METROPOLITAN HEALTH CLINIC</text>
  <text x="50" y="92" font-size="14" fill="#64748b">Outpatient Department — Printed Prescription Record</text>
  <text x="680" y="75" font-size="34" font-weight="bold" fill="#2563eb">Rx</text>

  <!-- Patient Details -->
  <line x1="30" y1="115" x2="770" y2="115" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="140" font-size="14" font-weight="600" fill="#334155">Patient: Fictional Test Subject A</text>
  <text x="320" y="140" font-size="14" font-weight="600" fill="#334155">Age: 45 / Male</text>
  <text x="550" y="140" font-size="14" font-weight="600" fill="#334155">Date: 23-Oct-2026</text>
  <line x1="30" y1="160" x2="770" y2="160" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Medication Section Title -->
  <text x="50" y="195" font-size="18" font-weight="bold" fill="#0f172a">PRESCRIBED MEDICATIONS</text>

  <!-- Medication 1 -->
  <rect x="45" y="215" width="710" height="70" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="65" y="245" font-size="20" font-weight="bold" fill="#0f172a">1. Amoxil 500 mg</text>
  <text x="65" y="270" font-size="14" fill="#475569">Generic: Amoxicillin Trihydrate | Dispense: 21 Capsules | Sig: 1 cap PO TID</text>

  <!-- Medication 2 -->
  <rect x="45" y="300" width="710" height="70" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="65" y="330" font-size="20" font-weight="bold" fill="#0f172a">2. Disprin 100 mg</text>
  <text x="65" y="355" font-size="14" fill="#475569">Generic: Aspirin (Acetylsalicylic Acid) | Dispense: 30 Tablets | Sig: 1 tab PO Daily</text>

  <!-- Medication 3 -->
  <rect x="45" y="385" width="710" height="70" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="65" y="415" font-size="20" font-weight="bold" fill="#0f172a">3. Panadol 500 mg</text>
  <text x="65" y="440" font-size="14" fill="#475569">Generic: Paracetamol | Dispense: 20 Tablets | Sig: 1 tab PO PRN for fever</text>

  <!-- Doctor Footer -->
  <line x1="30" y1="480" x2="770" y2="480" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="520" font-size="13" fill="#64748b">Verified by: Dr. J. Doe, MD (Lic # 98765-TEST)</text>
  <text x="50" y="540" font-size="12" fill="#94a3b8">Simulated sample prescription generated for hackathon testing purposes only.</text>
  
  <!-- Stamp -->
  <circle cx="680" cy="515" r="35" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="650" y="515" font-size="12" font-weight="bold" fill="#dc2626">CLINIC</text>
  <text x="645" y="530" font-size="10" fill="#dc2626">VERIFIED</text>
</svg>

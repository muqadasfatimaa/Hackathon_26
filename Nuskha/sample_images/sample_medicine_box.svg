<svg xmlns="http://www.w3.org/2000/svg" width="750" height="450" viewBox="0 0 750 450" style="background:#f1f5f9; font-family:'Segoe UI', Arial, sans-serif;">
  <!-- Packaging Box Outer -->
  <rect x="25" y="25" width="700" height="400" fill="#ffffff" stroke="#94a3b8" stroke-width="2" rx="12" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
  
  <!-- Color Banner -->
  <rect x="25" y="25" width="700" height="40" fill="#0284c7" rx="12 12 0 0"/>
  <rect x="25" y="55" width="700" height="10" fill="#0369a1"/>

  <!-- Brand Title -->
  <text x="60" y="130" font-size="48" font-weight="900" fill="#0f172a" letter-spacing="1">Augmentin</text>
  <rect x="360" y="85" width="160" height="50" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" rx="8"/>
  <text x="380" y="120" font-size="28" font-weight="bold" fill="#0369a1">625 mg</text>

  <!-- Generic Composition -->
  <text x="60" y="175" font-size="20" font-weight="600" fill="#334155">Amoxicillin / Clavulanic Acid</text>
  <text x="60" y="205" font-size="16" fill="#64748b">Each film-coated tablet contains: Amoxicillin Trihydrate 500 mg and Potassium Clavulanate 125 mg</text>
  
  <!-- Dosage Form & Count -->
  <rect x="60" y="235" width="220" height="40" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="75" y="260" font-size="15" font-weight="600" fill="#0f172a">14 Film-coated Tablets</text>

  <rect x="300" y="235" width="160" height="40" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="325" y="260" font-size="15" font-weight="600" fill="#0f172a">Oral Route (PO)</text>

  <!-- Warning & Storage -->
  <line x1="60" y1="305" x2="690" y2="305" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="335" font-size="13" font-weight="bold" fill="#dc2626">CAUTION: Prescription Only Medicine (POM)</text>
  <text x="60" y="360" font-size="13" fill="#64748b">Store below 25°C in a dry place. Keep out of reach of children.</text>
  <text x="60" y="385" font-size="12" fill="#94a3b8">Batch: NY8823 | Exp: 12/2027 | Mfr: Fictional Pharma Demo</text>
  
  <!-- Barcode Representation -->
  <rect x="520" y="330" width="160" height="60" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <line x1="535" y1="335" x2="535" y2="375" stroke="#000" stroke-width="3"/>
  <line x1="545" y1="335" x2="545" y2="375" stroke="#000" stroke-width="1"/>
  <line x1="555" y1="335" x2="555" y2="375" stroke="#000" stroke-width="4"/>
  <line x1="570" y1="335" x2="570" y2="375" stroke="#000" stroke-width="2"/>
  <line x1="585" y1="335" x2="585" y2="375" stroke="#000" stroke-width="3"/>
  <line x1="600" y1="335" x2="600" y2="375" stroke="#000" stroke-width="1"/>
  <line x1="615" y1="335" x2="615" y2="375" stroke="#000" stroke-width="4"/>
  <line x1="630" y1="335" x2="630" y2="375" stroke="#000" stroke-width="2"/>
  <line x1="645" y1="335" x2="645" y2="375" stroke="#000" stroke-width="3"/>
  <line x1="660" y1="335" x2="660" y2="375" stroke="#000" stroke-width="2"/>
  <text x="545" y="388" font-size="9" fill="#000">501234567890</text>
</svg>
